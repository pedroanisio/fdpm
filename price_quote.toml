# BRL-native São Paulo pricing inputs.
#
# Loaded by price_quote.load_pricing_inputs().
# All business data lives here so the Python module stays formula-only.

[project]
name = "iOS + Android to Flutter Rebuild"
city = "São Paulo"
currency = "BRL"

[constants]
# Brazilian labor-cost loading factor (taxes, benefits, indirect costs).
loaded_cost_multiplier = 1.55
# Standard productive hours per FTE-month.
hours_per_fte_month = 160

[commercial]
vendor_overhead_pct = 0.12
risk_contingency_pct = 0.08
target_margin_pct = 0.0

# ─── Role costs (monthly base BRL, pre-loading) ─────────────────────────────

[role_costs.flutter_developer]
role_name = "Flutter Developer"
monthly_base_cost_brl = 15000

[role_costs.senior_flutter_developer]
role_name = "Senior Flutter Developer"
monthly_base_cost_brl = 15000

[role_costs.backend_integration_engineer]
role_name = "Backend / Integration Engineer"
monthly_base_cost_brl = 15000

[role_costs.qa_engineer]
role_name = "QA Engineer"
monthly_base_cost_brl = 15000

[role_costs.tech_lead_architect]
role_name = "Tech Lead / Mobile Architect"
monthly_base_cost_brl = 15000

[role_costs.product_designer]
role_name = "Product Designer"
monthly_base_cost_brl = 15000

[role_costs.business_analyst_po]
role_name = "Business Analyst / PO"
monthly_base_cost_brl = 15000

[role_costs.delivery_manager]
role_name = "Delivery Manager"
monthly_base_cost_brl = 15000

[role_costs.devops_engineer]
role_name = "DevOps / CI-CD Engineer"
monthly_base_cost_brl = 15000

# ─── Engagement cycles ──────────────────────────────────────────────────────

[[cycles]]
name = "Discovery / Assessment"
months = 1
allocations = [
  { role = "tech_lead_architect",       fte = 1.0 },
  { role = "business_analyst_po",       fte = 1.0 },
  { role = "product_designer",          fte = 1.0 },
  { role = "senior_flutter_developer",  fte = 1.0 },
]

[[cycles]]
name = "Core Flutter Rebuild"
months = 6
allocations = [
  { role = "tech_lead_architect",          fte = 1.0 },
  { role = "senior_flutter_developer",     fte = 1.0 },
  { role = "flutter_developer",            fte = 3.0 },
  { role = "backend_integration_engineer", fte = 1.0 },
  { role = "qa_engineer",                  fte = 1.0 },
  { role = "business_analyst_po",          fte = 0.5 },
  { role = "product_designer",             fte = 0.5 },
  { role = "delivery_manager",             fte = 1.0 },
]

[[cycles]]
name = "Stabilization / Release"
months = 2
allocations = [
  { role = "tech_lead_architect",          fte = 0.5 },
  { role = "senior_flutter_developer",     fte = 1.0 },
  { role = "flutter_developer",            fte = 2.0 },
  { role = "backend_integration_engineer", fte = 0.5 },
  { role = "qa_engineer",                  fte = 1.5 },
  { role = "devops_engineer",              fte = 0.5 },
  { role = "business_analyst_po",          fte = 0.5 },
  { role = "delivery_manager",             fte = 0.5 },
]
