name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    defaults:
      run:
        working-directory: fdpm-cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: fdpm-cli/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Smoke packed npm install and command shims
        run: npm run smoke:pack

  python-renderer:
    name: ${{ matrix.os }} / Python renderer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest scripts/test_fdpm_to_latex.py -q

  renderer-visual:
    name: Renderer browser and PDF regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fdpm-cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fdpm-cli/package-lock.json
      - run: npm ci
      - name: Install Chromium and PDF inspection tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - run: npm run test:renderers:visual

  package:
    name: Package and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fdpm-cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fdpm-cli/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:public-readiness
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run --json --workspace @fdpm/zod-bridge
      - run: npm pack --dry-run --json
