name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: fdpm-cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: fdpm-cli/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fdpm-cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fdpm-cli/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:public-readiness
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run --json --workspace @fdpm/zod-bridge
      - run: npm pack --dry-run --json
