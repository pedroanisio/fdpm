name: Release readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fdpm-cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fdpm-cli/package-lock.json
      - run: npm ci
      - run: npm run release:check
      - run: npm pack --dry-run --json --workspace @fdpm/zod-bridge
      - run: npm pack --dry-run --json
