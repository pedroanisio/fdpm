# fdpm-mcp-http on DOKS tor1, single replica, single tenant.
#
# Differences from the generic ../../statefulset.yaml, all forced by this
# cluster rather than chosen for taste:
#
#   replicas: 1              MCP sessions live in pod memory and this
#                            cluster's Gateway API has no session-affinity
#                            equivalent for the nginx upstream-hash. One
#                            replica removes the need entirely, and with it
#                            the cross-pod write-lock hazard.
#   storageClassName         do-block-storage-retain, not the cluster
#                            default. The default reclaims Delete, and this
#                            volume holds append-only operation logs that
#                            are the system of record.
#   no imagePullSecrets      DOKS propagates a `braains-registry` secret
#                            onto each namespace's default ServiceAccount,
#                            and it authenticates registry.digitalocean.com
#                            as a whole, so it covers this registry too.
---
apiVersion: v1
kind: Namespace
metadata:
  name: fdpm-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: fdpm-mcp
  namespace: fdpm-mcp
  labels: { app: fdpm-mcp }
spec:
  selector: { app: fdpm-mcp }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fdpm-mcp
  namespace: fdpm-mcp
spec:
  serviceName: fdpm-mcp
  replicas: 1
  selector:
    matchLabels: { app: fdpm-mcp }
  template:
    metadata:
      labels: { app: fdpm-mcp }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 60
      containers:
        - name: gateway
          image: registry.digitalocean.com/arc4d3io-artifacts-registry/fdpm-mcp:1.3.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: FDPM_DATA_DIR
              value: /data
            - name: FDPM_MCP_HTTP_PORT
              value: "8080"
            # The server binds loopback by default; a pod must opt out.
            - name: FDPM_MCP_HTTP_HOST
              value: 0.0.0.0
            # MUST match the connector URL character for character: it is
            # the RFC 9728 `resource` value and the expected token audience.
            - name: FDPM_MCP_PUBLIC_URL
              value: https://mcp.veraformx.com/mcp
            - name: FDPM_MCP_OAUTH_ISSUER
              value: https://id.xaai.ai/realms/platform
            - name: FDPM_MCP_ALLOWED_HOSTS
              value: mcp.veraformx.com
            - name: FDPM_MCP_ALLOWED_ORIGINS
              value: https://claude.ai,https://chatgpt.com
            # AUTH MODE — Keycloak introspection against the platform realm.
            #
            # Two Keycloak facts drive the settings below, and both are
            # configuration rather than defects:
            #
            #  1. The realm's audience mapper puts the RESOURCE CLIENT ID in
            #     `aud`, not a URL. The MCP spec's resource indicator is a URL,
            #     so the expected audience is set explicitly here; the RFC 9728
            #     `resource` advertised to clients stays the public URL.
            #  2. Privileges are granted as Keycloak CLIENT ROLES, which arrive
            #     under `resource_access.fdpm-mcp.roles` rather than in `scope`.
            #     The verifier reads both and ignores roles on any other client.
            #
            # The issuer MUST be the value KC_HOSTNAME names on the Keycloak
            # deployment. Tokens are minted with that `iss` whichever hostname
            # was called, so configuring against an alias rejects every token.
            - name: FDPM_MCP_AUTH_MODE
              value: introspection
            - name: FDPM_MCP_INTROSPECTION_URL
              value: https://id.xaai.ai/realms/platform/protocol/openid-connect/token/introspect
            - name: FDPM_MCP_EXPECTED_AUDIENCE
              value: fdpm-mcp
            - name: FDPM_MCP_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: fdpm-mcp-auth, key: client-id }
            - name: FDPM_MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: fdpm-mcp-auth, key: client-secret }
            # Single-tenant: every principal is pinned here, whatever the
            # token claims, so Keycloak needs no tenant claim.
            - name: FDPM_MCP_SINGLE_TENANT
              value: default
            # Read only at discovery; a writing client is told which scope
            # to request by the 401 challenge.
            - name: FDPM_MCP_ADVERTISED_SCOPES
              value: fdpm.read,fdpm.write
            # Destructive tools off. Even on, a caller needs fdpm.admin.
            - name: FDPM_MCP_ENABLE_DESTRUCTIVE
              value: "0"
            - name: FDPM_MCP_MAX_CALLS_PER_MINUTE
              value: "120"
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            # Nodes are 2 vCPU / 16 GiB and already carry other workloads,
            # so this is sized for one tenant, not for the 32-host pool cap.
            limits: { memory: "2Gi" }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: do-block-storage-retain
        resources:
          requests:
            storage: 10Gi
