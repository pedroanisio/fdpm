name: plugin/acme-business-deck

on:
  push:
    branches: [main]
    paths:
      - "plugins/acme_business_deck/**"
      - "packages/zod-bridge/**"
      - "tests/plugins/acme_business_deck/**"
      - ".github/workflows/plugin-acme-business-deck.yml"
  pull_request:
    paths:
      - "plugins/acme_business_deck/**"
      - "packages/zod-bridge/**"
      - "tests/plugins/acme_business_deck/**"
      - ".github/workflows/plugin-acme-business-deck.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build @fdpm/zod-bridge
        working-directory: packages/zod-bridge
        run: npm run build

      - name: Bridge drift gate
        run: npx tsx plugins/acme_business_deck/scripts/run-bridge.ts --check

      - name: Plugin tests (mapping, CEL, validator-equivalence, roundtrip, determinism, expr-helper-purity, failure-modes, manifest-parity, version-bump)
        run: npx vitest run tests/plugins/acme_business_deck

      - name: Host typecheck (plugins/** is included)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Full host test suite
        run: npx vitest run
