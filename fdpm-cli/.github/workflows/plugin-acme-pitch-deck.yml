name: plugin/acme-pitch-deck

# Per howto-zod-to-fdpm-plugin §11 (`example:ci-snapshot-gate`,
# `principle:schema-change-implies-version-bump`). Runs on every PR
# touching the plugin or its tests, and on pushes to main.
#
# Three gates, in dependency order:
#   1. The bridge's --check mode rebuilds artefacts in memory and
#      diffs against the committed generated/* tree. Any drift means
#      the schema changed without `npm run bridge` (failure:schema-
#      drift-no-bump).
#   2. The plugin's vitest suite — six how-to-mandated testcases
#      (mapping, CEL, validator-equivalence, roundtrip, determinism,
#      expr-helper-purity) plus failure-mode coverage, manifest-parity,
#      and the version-bump gate.
#   3. The full host suite to catch any cross-cutting regression.

on:
  push:
    branches: [main]
    paths:
      - "plugins/acme_pitch_deck/**"
      - "packages/zod-bridge/**"
      - "tests/plugins/acme_pitch_deck/**"
      - ".github/workflows/plugin-acme-pitch-deck.yml"
  pull_request:
    paths:
      - "plugins/acme_pitch_deck/**"
      - "packages/zod-bridge/**"
      - "tests/plugins/acme_pitch_deck/**"
      - ".github/workflows/plugin-acme-pitch-deck.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build @fdpm/zod-bridge
        working-directory: packages/zod-bridge
        run: npm run build

      - name: Bridge drift gate
        run: npx tsx plugins/acme_pitch_deck/scripts/run-bridge.ts --check

      - name: Plugin tests (mapping, CEL, validator-equivalence, roundtrip, determinism, expr-helper-purity, failure-modes, manifest-parity, version-bump)
        run: npx vitest run tests/plugins/acme_pitch_deck

      - name: Host typecheck (plugins/** is included)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Full host test suite
        run: npx vitest run
