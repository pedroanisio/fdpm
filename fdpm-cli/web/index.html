<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse FDPM workbooks, plugins, profiles, and verified planning state."
    />
    <title>FDPM Workbench</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f1115'/><rect x='5.5' y='5.5' width='21' height='21' rx='3' fill='none' stroke='%235fd7c0' stroke-width='1.5'/><path d='M11 9.5h10M11 15.5h7M11 21.5h4' stroke='%237aa2ff' stroke-width='2' stroke-linecap='square'/></svg>"
    />
    <script>
      // Theme bootstrap — runs before paint to prevent FOUC.
      // Resolution order: localStorage → prefers-color-scheme → 'dark'.
      (function () {
        try {
          var saved = localStorage.getItem('fdpm-theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
